name: null-horizon-session-hijack
services:
  web:
    build: .
    restart: unless-stopped
    environment:
      CHALLENGE_FLAG: "${CHALLENGE_FLAG:?Run setup.ps1 first}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [challenge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:8092"
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [frontend, challenge]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
networks:
  frontend: {}
  challenge:
    internal: true
